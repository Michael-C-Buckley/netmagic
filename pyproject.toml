[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "netmagic"
version = "0.1.3"
description = "Network Automation Toolset"
requires-python = ">=3.13"
authors = [
    { name = "Michael Buckley" },
]

# Add this after creating the missing README.md:
# readme = "README.md"

dependencies = [
    "cryptography>=50.0.0,<51",
    "defusedxml>=0.7.1,<1",
    "mactools>=2.0.0,<3",
    "ncclient>=0.7.0,<1",
    "netmiko>=4.7.0,<5",
    "openpyxl>=3.1.5,<4",
    "pydantic>=2.13.4,<3",
    "pyserial>=3.5,<4",
    "textfsm>=2.1.0,<3",
]

[dependency-groups]
dev = [
    "bandit>=1.9.3,<2",
    "pip-audit>=2.10.0,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.14.14,<1",
    "ty>=0.0.23,<1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["netmagic*"]
exclude = ["tests*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.textfsm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.bandit]
exclude_dirs = ["tests"]
